name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    # A imagem oficial já cria o database a partir de POSTGRES_DB — não
    # precisa do scripts/setup-test-db.ts (esse é só pra criar o database
    # num Postgres compartilhado de dev, via docker-compose).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma
          POSTGRES_DB: projeto_prisma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prisma -d projeto_prisma_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://prisma:prisma@localhost:5432/projeto_prisma_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # migrate deploy (não migrate dev) — só aplica o que já está commitado,
      # sem diff/drift detection. Ver README §Migrações para o porquê disso importar.
      - run: npx prisma migrate deploy

      - run: pnpm typecheck

      - run: pnpm build

      - run: pnpm test

  frontend:
    runs-on: ubuntu-latest

    # Projeto próprio, isolado do workspace pnpm da raiz (tem seu próprio
    # pnpm-workspace.yaml vazio — ver frontend/README.md) — por isso os
    # passos rodam a partir de frontend/, com lockfile e install próprios.
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # `tsc -b && vite build` — typecheck e build de produção num passo só.
      - run: pnpm build

  client-portal:
    runs-on: ubuntu-latest

    # Mesmo isolamento do job frontend, projeto próprio (client-portal/pnpm-workspace.yaml).
    defaults:
      run:
        working-directory: client-portal

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client-portal/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # frontend/ não tem este passo porque não tem testes — client-portal
      # ganhou desde o início (Fase 7 do plano): é o primeiro contato do
      # cliente final, cobre o fluxo que gera receita da loja, e não tem
      # ninguém por perto pra notar uma regressão silenciosa além do
      # cliente frustrado indo pra concorrência.
      - run: pnpm test
