services:
  postgres:
    image: postgres:16-alpine
    container_name: prisma-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: prisma
      POSTGRES_PASSWORD: prisma
      POSTGRES_DB: projeto_prisma
    ports:
      - "5432:5432"
    volumes:
      - prisma_postgres_data:/var/lib/postgresql/data
      # só roda em volume NOVO (script de init do Postgres) — se o volume já
      # existir de antes desta mudança, criar o banco do Evolution é
      # manual: `docker compose exec postgres psql -U prisma -c "CREATE DATABASE evolution"`
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prisma -d projeto_prisma"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Opcional — atrás de um profile pra não mudar o fluxo padrão de dev
  # (`pnpm db:up` continua subindo só o Postgres; a API roda local com
  # hot-reload via `pnpm dev`). Suba com `docker compose --profile full up`
  # pra testar a imagem publicada de ponta a ponta.
  api:
    build: .
    container_name: prisma-api
    restart: unless-stopped
    profiles: ["full"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://prisma:prisma@postgres:5432/projeto_prisma?schema=public
      JWT_SECRET: ${JWT_SECRET:-troque-por-um-segredo-forte-em-producao}
      NODE_ENV: production
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    ports:
      - "3000:3000"

  # Opcional — atrás de um profile próprio (`whatsapp`), não o `full`:
  # `pnpm db:up` continua só Postgres, e quem testa a imagem da API
  # (--profile full) não devia ser obrigado a subir uma stack de WhatsApp
  # junto. Suba com `docker compose --profile whatsapp up` (a API roda no
  # host via `pnpm dev`) ou `--profile full --profile whatsapp` pra tudo
  # containerizado. Ver n8n/README.md para o passo a passo completo
  # (pareamento por QR, credenciais, registro do endpoint).
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.36.0
    container_name: prisma-n8n
    restart: unless-stopped
    profiles: ["whatsapp"]
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    # deixa o n8n (rodando no container) alcançar a API rodando no host via
    # `pnpm dev` — só Linux precisa disto; Docker Desktop já resolve sozinho
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # `:-` (default vazio), não `:?` (obrigatório) — docker compose
      # interpola o arquivo INTEIRO antes de decidir quais serviços o
      # profile ativado realmente sobe, então uma variável obrigatória
      # aqui quebraria até `pnpm db:up` (só sobe o postgres, profile
      # nenhum). Sem preencher de verdade, o container só falha ao subir
      # DE PROPÓSITO — não silenciosamente — ver n8n/README.md.
      #
      # se perder esta chave, toda credencial salva no n8n vira ilegível —
      # gerar uma vez com `openssl rand -hex 24` e nunca trocar depois
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-}
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
      WEBHOOK_URL: http://localhost:5678/
      # sem isto, o nó de Code que confere o HMAC não consegue `require('crypto')`
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      # sem isto (false é o padrão, mas fixado explícito — uma atualização
      # futura do n8n não pode mudar isso silenciosamente), `$env` não
      # funciona dentro do nó de Code nem nas expressões dos outros nós
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # lidos via {{$env.X}} pelos workflows (n8n/workflows/*.json) — ver
      # .env.example §WhatsApp pro passo a passo de preencher cada um
      PRISMA_API_URL: ${PRISMA_API_URL:-http://host.docker.internal:3000}
      PRISMA_WEBHOOK_SECRET: ${PRISMA_WEBHOOK_SECRET:-}
      PRISMA_API_KEY: ${PRISMA_API_KEY:-}
      EVOLUTION_URL: http://evolution:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-barbearia}

  evolution:
    image: atendai/evolution-api:v2.2.3
    container_name: prisma-evolution
    restart: unless-stopped
    profiles: ["whatsapp"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - evolution_instances:/evolution/instances
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-}
      SERVER_URL: http://localhost:8080
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://prisma:prisma@postgres:5432/evolution?schema=public
      DATABASE_SAVE_DATA_INSTANCE: "true"
      # cache local em vez de Redis — evita subir mais um serviço só pra
      # cache, nesta escala não compensa
      CACHE_LOCAL_ENABLED: "true"
      CACHE_REDIS_ENABLED: "false"
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://n8n:5678/webhook/evolution-inbound

volumes:
  prisma_postgres_data:
  n8n_data:
  evolution_instances:
